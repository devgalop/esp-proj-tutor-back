# =============================================================================
# Production Docker Compose
# =============================================================================
# CI/CD injects secrets as environment variables at deploy time.
# DO NOT use env_file in production — secrets come from your orchestrator
# (GitHub Actions secrets, AWS Parameter Store, Vault, etc.).
#
# Deploy with:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set by CI/CD or .env on the host):
#   DATABASE_URL, JWT_SECRET_KEY, BREVO_API_KEY, GROQ_API_KEY,
#   OPENCODE_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, etc.
# See .env.example for the full list.
# =============================================================================

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: db-itmentorsoft-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.9-alpine3.24
    container_name: valkey-prod
    ports:
      - "6379:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey_prod_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    # CI/CD should build and push this image before deploying.
    # Replace with your actual registry path.
    image: devgalop/esp-proj-tutor-back:latest
    container_name: api-itmentorsoft-prod
    # Secrets are injected by the CI/CD pipeline or orchestrator.
    # Each variable is referenced here; the actual value comes from the
    # host environment (e.g., GitHub Actions secrets, AWS SSM, Vault).
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_DELTA_SECONDS=${JWT_EXPIRATION_DELTA_SECONDS:-1800}
      - RANDOM_TOKEN_EXPIRATION_DELTA_SECONDS=${RANDOM_TOKEN_EXPIRATION_DELTA_SECONDS:-1800}
      - REFRESH_TOKEN_EXPIRATION_DELTA_SECONDS=${REFRESH_TOKEN_EXPIRATION_DELTA_SECONDS:-604800}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_BASE_API_URL=${BREVO_BASE_API_URL:-https://api.brevo.com/v3}
      - EMAIL_DEFAULT_SENDER=${EMAIL_DEFAULT_SENDER}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - OPENCODE_API_URL=${OPENCODE_API_URL:-https://opencode.ai/zen/go/v1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_SQS_QUALIFICATION_QUEUE_URL=${AWS_SQS_QUALIFICATION_QUEUE_URL}
      - AWS_SQS_CLASSIFICATION_QUEUE_URL=${AWS_SQS_CLASSIFICATION_QUEUE_URL}
      - RECOVERY_URL_BASE=${RECOVERY_URL_BASE}
      - REVIEW_URL_BASE=${REVIEW_URL_BASE}
      - LOGIN_URL_BASE=${LOGIN_URL_BASE}
      - ASSESSMENT_QUALIFICATION_CHUNK_SIZE=${ASSESSMENT_QUALIFICATION_CHUNK_SIZE:-5}
      - ASSESSMENT_MAX_QUESTIONS_NUMBER=${ASSESSMENT_MAX_QUESTIONS_NUMBER:-5}
      - VALKEY_HOST=${VALKEY_HOST:-valkey-prod}
      - VALKEY_PORT=${VALKEY_PORT:-6379}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - VALKEY_DB=${VALKEY_DB:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_prod_data:
  valkey_prod_data:
